<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Preview Cart</title><style>:root{--g:#1a3c2a;--g2:#244b36;--gold:#c9a84c;--gold2:#e1ca88;--bg:#faf7f1;--text:#233128;--muted:#6d756d;--b:rgba(201,168,76,.18);--s:0 14px 35px rgba(20,40,28,.08);--r1:24px;--r2:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--text)}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 32px));margin:auto}.header{background:var(--g);padding:18px 0;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--gold)}.logo img{width:100%;height:100%;object-fit:cover}.brand h1{margin:0;color:var(--gold);font-size:20px}.hero{padding:40px 0;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.hero h2{margin:0;font-size:32px}.wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;padding:48px 0}.card{background:#fff;border:1px solid var(--b);border-radius:var(--r1);box-shadow:var(--s)}.table{padding:18px;overflow:auto}.item{display:grid;grid-template-columns:110px 1fr auto auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #f0e7d7}.thumb{height:90px;border-radius:16px;background:linear-gradient(135deg,#ece3d5,#d7cebf)}.title{font-weight:bold;color:var(--g)}.muted{color:var(--muted);font-size:14px}.qty{padding:10px 14px;border-radius:999px;border:1px solid var(--b)}.summary{padding:24px}.summary h3{margin-top:0;color:var(--g)}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed #e9debf}.line.total{font-weight:bold;color:var(--g);font-size:18px}.btn{display:block;text-align:center;margin-top:18px;padding:14px 20px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1d1d1d;font-weight:bold}.footer{background:#10251a;color:rgba(255,255,255,.8);text-align:center;padding:24px 0;margin-top:30px}@media(max-width:900px){.wrap{grid-template-columns:1fr}.item{grid-template-columns:90px 1fr}}</style></head><body><header class="header"><div class="container row"><div class="brand"><div class="logo"><img src="static/assets/logo.png" alt="logo"></div><h1>NEWMOON HOME</h1></div><div><a href="preview_site.html">خانه</a> | <a href="preview_product_list.html">محصولات</a></div></div></header><section class="hero"><div class="container"><h2>سبد خرید</h2></div></section><section><div class="container wrap"><div class="card table"><div class="item"><div class="thumb"></div><div><div class="title">مبل آتریا</div><div class="muted">رنگ: سبز تیره | پارچه: مخمل | سایز: بزرگ</div></div><div class="qty">1</div><div class="title">48,000,000</div></div><div class="item"><div class="thumb"></div><div><div class="title">میز مون</div><div class="muted">رنگ: گردویی | ابعاد: استاندارد</div></div><div class="qty">1</div><div class="title">22,500,000</div></div></div><aside class="card summary"><h3>خلاصه سفارش</h3><div class="line"><span>جمع کل</span><strong>70,500,000</strong></div><div class="line"><span>تخفیف</span><strong>2,000,000-</strong></div><div class="line"><span>هزینه ارسال</span><strong>1,500,000</strong></div><div class="line total"><span>قابل پرداخت</span><strong>70,000,000</strong></div><a class="btn" href="preview_checkout.html">ادامه و تسویه حساب</a></aside></div></section><footer class="footer">Cart Preview</footer></body></html>
