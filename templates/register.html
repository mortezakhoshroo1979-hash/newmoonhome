{% extends 'base.html' %}
{% block title %}ثبت‌نام | NEWMOON HOME{% endblock %}
{% block content %}
<section class="auth-section section-space">
    <div class="container">
        <div class="auth-card mx-auto auth-card-wide">
            <div class="text-center mb-4">
                <span class="section-kicker">Join Us</span>
                <h1>ایجاد حساب کاربری</h1>
            </div>
            <form class="luxury-form">
                <div class="row g-3">
                    <div class="col-md-6"><label>نام</label><input type="text" class="form-control"></div>
                    <div class="col-md-6"><label>نام خانوادگی</label><input type="text" class="form-control"></div>
                    <div class="col-md-6"><label>شماره موبایل</label><input type="tel" class="form-control"></div>
                    <div class="col-md-6"><label>ایمیل</label><input type="email" class="form-control"></div>
                    <div class="col-md-6"><label>رمز عبور</label><input type="password" class="form-control"></div>
                    <div class="col-md-6"><label>تکرار رمز عبور</label><input type="password" class="form-control"></div>
                </div>
                <button class="btn btn-brand w-100 mt-4">ثبت‌نام</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
