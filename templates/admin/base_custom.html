<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل مدیریت NEW MOON HOME{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="/static/admin/css/custom-admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 sidebar">
            <div class="brand py-4 text-center text-white fw-bold">NEW MOON HOME</div>
            <nav class="nav flex-column px-3">
                <a class="nav-link" href="{% url 'custom_admin:dashboard' %}">داشبورد</a>
                <a class="nav-link" href="{% url 'custom_admin:product_list' %}">محصولات</a>
                <a class="nav-link" href="{% url 'custom_admin:bulk_price_update' %}">تغییرات گروهی قیمت</a>
                <a class="nav-link" href="{% url 'custom_admin:orders_dashboard' %}">سفارشات</a>
                <a class="nav-link" href="{% url 'custom_admin:user_list' %}">کاربران</a>
                <a class="nav-link" href="{% url 'custom_admin:discounts_dashboard' %}">تخفیف‌ها</a>
                <a class="nav-link" href="{% url 'custom_admin:content_dashboard' %}">محتوا</a>
            </nav>
        </aside>
        <main class="col-md-10 py-4 px-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
</body>
</html>
