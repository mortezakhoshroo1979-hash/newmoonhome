<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت نیومون هوم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <style>
        :root { --p-color: {{ site.primary_color|default:"#0a1511" }}; --s-color: {{ site.secondary_color|default:"#c9a84c" }}; }
        body { background: #f4f6f9; font-family: Tahoma; overflow-x: hidden; }
        
        /* سایدبار حرفه‌ای */
        .sidebar { width: 260px; height: 100vh; background: var(--p-color); position: fixed; right: 0; top: 0; transition: 0.3s; z-index: 1000; border-left: 2px solid var(--s-color); }
        .main-content { margin-right: 260px; padding: 30px; transition: 0.3s; }
        
        .nav-item { padding: 12px 25px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-link { color: rgba(255,255,255,0.7) !important; font-weight: 500; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: var(--s-color) !important; background: rgba(255,255,255,0.05); }
        
        .header-top { background: white; padding: 15px 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        
        @media (max-width: 768px) {
            .sidebar { right: -260px; }
            .sidebar.active { right: 0; }
            .main-content { margin-right: 0; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="p-4 text-center border-bottom border-secondary mb-3">
        <h4 class="text-white fw-bold" style="color: var(--s-color) !important;">N M H Admin</h4>
        <span class="badge bg-secondary small">نسخه ۱.۰ تجاری</span>
    </div>
    <div class="nav-item"><a href="/manage/" class="nav-link active">🏠 پیشخوان</a></div>
    <div class="nav-item"><a href="/manage/settings/" class="nav-link">⚙️ تنظیمات برندینگ</a></div>
    <div class="nav-item"><a href="/manage/custom-orders/" class="nav-link">🎙️ سفارشات سفارشی</a></div>
    <div class="nav-item"><a href="/admin/store/product/" class="nav-link">📦 مدیریت انبار</a></div>
    <div class="nav-item mt-5"><a href="/manage/logout/" class="nav-link text-danger">🚪 خروج از سیستم</a></div>
</div>

<div class="main-content">
    <div class="header-top rounded-4 mb-4">
        <button class="btn btn-dark d-md-none" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</button>
        <div class="fw-bold text-dark">خوش آمدید، {{ user.username }}</div>
        <a href="/" target="_blank" class="btn btn-sm btn-outline-primary">👁️ مشاهده سایت</a>
    </div>

    {% if messages %}
        {% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}
    {% endif %}

    {% block admin_content %}{% endblock %}
</div>

</body>
</html>
