```html
{% block admin_content %}
<style>
  :root {
    --p-color: #0b3d2e;      /* deep emerald */
    --p-color-soft: #14584380;
    --s-color: #d4af37;      /* gold */
    --s-color-soft: #f5d97a;
  }

  .lux-wrap {
    direction: rtl;
    font-family: "Vazirmatn", "Inter", system-ui, sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
    background:
      radial-gradient(1200px 600px at 90% -10%, rgba(212,175,55,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(11,61,46,0.55), transparent 60%),
      linear-gradient(135deg, #04170f 0%, #0b3d2e 55%, #04170f 100%);
    color: #f4efe4;
  }

  .lux-header {
    max-width: 1200px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .lux-header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 0;
    background: linear-gradient(90deg, var(--s-color-soft), var(--s-color));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lux-header .crumbs {
    font-size: 13px;
    color: rgba(244,239,228,0.65);
  }
  .lux-header .crumbs span { color: var(--s-color); }

  .lux-form {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .lux-full { grid-column: 1 / -1; }

  .glass-card {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 22px;
    padding: 28px;
    backdrop-filter: blur(22px) saturate(140%);
    box-shadow:
      0 20px 60px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .glass-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(140deg, rgba(212,175,55,0.55), transparent 40%, rgba(212,175,55,0.25));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    pointer-events: none;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(212,175,55,0.18);
  }
  .card-head .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--s-color);
    box-shadow: 0 0 14px var(--s-color);
  }
  .card-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: #fff;
  }
  .card-head small {
    margin-inline-start: auto;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--s-color-soft);
  }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
    color: rgba(244,239,228,0.85);
  }
  .field label .req { color: var(--s-color); margin-inline-start: 4px; }

  .input,
  .textarea {
    width: 100%;
    background: rgba(4,23,15,0.45);
    border: 1px solid rgba(212,175,55,0.22);
    border-radius: 12px;
    padding: 13px 16px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.25s ease;
    outline: none;
  }
  .input::placeholder,
  .textarea::placeholder { color: rgba(244,239,228,0.35); }
  .input:focus,
  .textarea:focus {
    border-color: var(--s-color);
    background: rgba(4,23,15,0.7);
    box-shadow: 0 0 0 4px rgba(212,175,55,0.15);
  }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .input-affix {
    position: relative;
  }
  .input-affix .affix {
    position: absolute;
    inset-inline-start: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: var(--s-color-soft);
    letter-spacing: 1px;
    pointer-events: none;
  }
  .input-affix .input { padding-inline-start: 52px; }

  .dropzone {
    border: 1.5px dashed rgba(212,175,55,0.35);
    border-radius: 14px;
    padding: 22px;
    text-align: center;
    background: rgba(4,23,15,0.35);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .dropzone:hover {
    border-color: var(--s-color);
    background: rgba(212,175,55,0.06);
  }
  .dropzone .icon {
    width: 46px; height: 46px;
    margin: 0 auto 10px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(212,175,55,0.05));
    color: var(--s-color);
    font-size: 22px;
    border: 1px solid rgba(212,175,55,0.35);
  }
  .dropzone p { margin: 0; font-size: 13px; color: rgba(244,239,228,0.75); }
  .dropzone p b { color: var(--s-color); font-weight: 600; }
  .dropzone small { display:block; margin-top: 4px; font-size: 11px; color: rgba(244,239,228,0.4); }
  .dropzone input[type="file"] { display: none; }

  .textarea { min-height: 180px; resize: vertical; line-height: 1.7; }

  .actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
  }
  .btn-ghost {
    padding: 14px 26px;
    border-radius: 12px;
    background: transparent;
    border: 1px solid rgba(244,239,228,0.25);
    color: rgba(244,239,228,0.85);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-ghost:hover { border-color: rgba(244,239,228,0.6); color: #fff; }

  .btn-gold {
    position: relative;
    padding: 15px 42px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #1a1206;
    background: linear-gradient(135deg, #f5d97a 0%, var(--s-color) 45%, #a8802a 100%);
    box-shadow:
      0 10px 30px -8px rgba(212,175,55,0.55),
      inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-gold:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 40px -10px rgba(212,175,55,0.7),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .btn-gold:active { transform: translateY(0); }

  @media (max-width: 900px) {
    .lux-form { grid-template-columns: 1fr; }
    .row-2 { grid-template-columns: 1fr; }
  }
</style>

<div class="lux-wrap">
  <div class="lux-header">
    <div>
      <div class="crumbs">مدیریت <span>›</span> محصولات <span>›</span> افزودن محصول</div>
      <h1>افزودن / ویرایش محصول لوکس</h1>
    </div>
    <button type="button" class="btn-ghost">بازگشت به لیست</button>
  </div>

  <form class="lux-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- LEFT: General Info -->
    <section class="glass-card">
      <div class="card-head">
        <span class="dot"></span>
        <h2>اطلاعات کلی</h2>
        <small>General</small>
      </div>

      <div class="field">
        <label for="name_fa">نام محصول (فارسی) <span class="req">*</span></label>
        <input id="name_fa" name="name_fa" type="text" class="input" placeholder="مثلاً: مبل سلطنتی رویال" required>
      </div>

      <div class="field">
        <label for="name_en">نام محصول (English)</label>
        <input id="name_en" name="name_en" type="text" class="input" placeholder="e.g. Royal Sofa" dir="ltr">
      </div>
      
      <div class="field">
        <label for="name_ar">نام محصول (English)</label>
        <input id="name_ar" name="name_ar" type="text" class="input" placeholder="مثلاً (طاولة التلفاز طراز فيكتوريا)" dir="ltr">
      </div>

      <div class="row-2">
        <div class="field">
          <label for="price">قیمت <span class="req">*</span></label>
          <div class="input-affix">
            <span class="affix">تومان</span>
            <input id="price" name="price" type="number" class="input" placeholder="0" required>
          </div>
        </div>
        <div class="field">
          <label for="old_price">قیمت قبلی</label>
          <div class="input-affix">
            <span class="affix">تومان</span>
            <input id="old_price" name="old_price" type="number" class="input" placeholder="0">aceholder="0">
          </div>
        </div>
      </div>

      <div class="field">
        <label for="stock">موجودی انبار</label>
        <input id="stock" name="stock" type="number" class="input" placeholder="تعداد در انبار" min="0">
      </div>
    </section>

    <!-- RIGHT: Media -->
    <section class="glass-card">
      <div class="card-head">
        <span class="dot"></span>
        <h2>رسانه‌ها</h2>
        <small>Media</small>
      </div>

      <div class="field">
        <label>تصویر اصلی محصول <span class="req">*</span></label>
        <label class="dropzone" for="main_image">
          <div class="icon">✦</div>
          <p>برای انتخاب تصویر <b>کلیک کنید</b> یا فایل را رها کنید</p>
          <small>PNG، JPG یا WEBP — حداکثر ۵ مگابایت</small>
          <input id="main_image" name="main_image" type="file" accept="image/*">
        </label>
      </div>

      <div class="field">
        <label>تصویر پس‌زمینه</label>
        <label class="dropzone" for="background_image">
          <div class="icon">❖</div>
          <p>افزودن <b>تصویر پس‌زمینه</b> صفحه محصول</p>
          <small>ابعاد پیشنهادی: 1920×1080</small>
          <input id="background_image" name="background_image" type="file" accept="image/*">
        </label>
      </div>
    </section>

    <!-- BOTTOM: Description -->
    <section class="glass-card lux-full">
      <div class="card-head">
        <span class="dot"></span>
        <h2>توضیحات محصول</h2>
        <small>Description</small>
      </div>
      <div class="field">
        <label for="description">شرح کامل، جنس، ابعاد و ویژگی‌ها</label>
        <textarea id="description" name="description" class="textarea"
          placeholder="این محصول با بهره‌گیری از چوب گردوی درجه یک و روکش مخمل ایتالیایی ساخته شده است..."></textarea>
      </div>
    </section>

    <div class="actions">
      <button type="reset" class="btn-ghost">انصراف</button>
      <button type="submit" class="btn-gold">ذخیره محصول</button>
    </div>
  </form>
</div>
{% endblock %}
```
