{% extends "store/base.html" %}
{% block content %}
<div class="container py-5 text-center text-white" dir="rtl">
    <div class="card p-5 bg-dark border-gold mx-auto shadow-lg" style="max-width: 600px; background: rgba(0,0,0,0.4) !important; backdrop-filter: blur(10px);">
        <h1 style="font-size: 4rem;">✨</h1>
        <h2 class="text-gold fw-bold mb-4">سفارش شما با موفقیت ثبت شد</h2>
        <p class="opacity-75">شماره فاکتور شما: <b class="text-gold">#{{ order.id }}</b></p>
        <p class="small">همکاران ما در بخش فروش نیومون هوم به زودی با شما تماس می‌گیرند.</p>
        <hr class="border-secondary my-4">
        <a href="/" class="btn btn-luxury px-5 py-3">بازگشت به فروشگاه</a>
    </div>
</div>
{% endblock %}
