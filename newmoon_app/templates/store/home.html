{% extends "store/base.html" %} {% block content %} <style> /* هیرو سکشن هوشمند */ .hero-box { height: 80vh; min-height: 500px; background-color: var(--emerald); {% if site.hero_image %} background-image: url('{{ site.hero_image.url }}'); {% endif %} background-size: cover; background-position: center; position: relative; display: flex; align-items: center; justify-content: center; } .hero-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); } .product-card-luxury { background: rgba(255,255,255,0.03); border: 1px solid rgba(201,168,76,0.1); transition: 0.4s; overflow: hidden; } .product-card-luxury img { width: 100%; height: 300px; object-fit: cover; } </style> <div class="hero-box"> <div class="hero-overlay"></div> <div class="container position-relative text-center text-white"> <h1 class="display-2 fw-bold mb-3" style="font-family: serif;">{{ site.hero_title|default:"NEWMOON HOME" }}</h1> <p class="lead opacity-75 mb-5 mx-auto" style="max-width: 700px;">{{ site.hero_subtitle }}</p> <a href="#featured" class="btn btn-luxury px-5 py-2">اکتشاف کالکشن</a> </div> </div> <section id="featured" class="py-5 bg-emerald"> <div class="container"> <div class="row g-4"> {% for p in featured %} <div class="col-6 col-md-3"> <a href="{{ p.get_absolute_url }}" class="text-decoration-none"> <div class="card product-card-luxury h-100 p-2"> <div class="overflow-hidden"> {% if p.image %} <img src="{{ p.image.url }}" alt="{{ p.name_fa }}"> {% else %} <div class="bg-dark d-flex align-items-center justify-content-center" style="height:300px;">🖼️</div> {% endif %} </div> <div class="card-body text-center"> <h6 class="text-white fw-light mb-1">{{ p.name_fa }}</h6> <p class="text-gold small mb-0">{{ p.price }} ریال</p> </div> </div> </a> </div> {% endfor %} </div> </div> </section> {% endblock %}
