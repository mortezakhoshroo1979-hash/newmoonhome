<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Preview Checkout</title><style>:root{--g:#1a3c2a;--g2:#244b36;--gold:#c9a84c;--gold2:#e1ca88;--bg:#faf7f1;--text:#233128;--muted:#6d756d;--b:rgba(201,168,76,.18);--s:0 14px 35px rgba(20,40,28,.08);--r1:24px;--r2:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--text)}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 32px));margin:auto}.header{background:var(--g);padding:18px 0;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--gold)}.logo img{width:100%;height:100%;object-fit:cover}.brand h1{margin:0;color:var(--gold);font-size:20px}.hero{padding:40px 0;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.hero h2{margin:0;font-size:32px}.wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;padding:48px 0}.card{background:#fff;border:1px solid var(--b);border-radius:var(--r1);box-shadow:var(--s)}.form{padding:24px}.form h3,.summary h3{margin-top:0;color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field input,.field textarea,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--b);font-family:inherit}.field textarea{min-height:110px}.sel{margin-top:16px;padding:14px;border:1px solid var(--b);border-radius:16px}.summary{padding:24px}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed #e9debf}.line.total{font-weight:bold;color:var(--g);font-size:18px}.btn{display:block;text-align:center;margin-top:18px;padding:14px 20px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1d1d1d;font-weight:bold}.footer{background:#10251a;color:rgba(255,255,255,.8);text-align:center;padding:24px 0;margin-top:30px}@media(max-width:900px){.wrap,.grid{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container row"><div class="brand"><div class="logo"><img src="static/assets/logo.png" alt="logo"></div><h1>NEWMOON HOME</h1></div><div><a href="preview_site.html">خانه</a> | <a href="preview_cart.html">سبد</a></div></div></header><section class="hero"><div class="container"><h2>تسویه حساب</h2></div></section><section><div class="container wrap"><div class="card form"><h3>اطلاعات سفارش</h3><div class="grid"><div class="field"><input placeholder="نام و نام خانوادگی"></div><div class="field"><input placeholder="شماره موبایل"></div><div class="field"><input placeholder="ایمیل"></div><div class="field"><input placeholder="کد پستی"></div><div class="field"><input placeholder="استان"></div><div class="field"><input placeholder="شهر"></div></div><div class="field" style="margin-top:14px"><textarea placeholder="آدرس کامل"></textarea></div><div class="sel">روش ارسال: ارسال ویژه شهری — 1,500,000 ریال</div><div class="sel">درگاه پرداخت: پرداخت امن بانکی</div></div><aside class="card summary"><h3>خلاصه نهایی</h3><div class="line"><span>مبل آتریا</span><strong>48,000,000</strong></div><div class="line"><span>میز مون</span><strong>22,500,000</strong></div><div class="line"><span>ارسال</span><strong>1,500,000</strong></div><div class="line total"><span>قابل پرداخت</span><strong>72,000,000</strong></div><a class="btn" href="#">پرداخت و تکمیل سفارش</a></aside></div></section><footer class="footer">Checkout Preview</footer></body></html>
